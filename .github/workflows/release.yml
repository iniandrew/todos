name: Release

# Builds installers for every platform and publishes them as a GitHub release
# tagged `v<version>` (the version comes from src-tauri/tauri.conf.json), with
# release notes from CHANGELOG.md.
# Trigger it by pushing a matching tag, or run it manually from the Actions tab.
#
# In-app updates: when the TAURI_SIGNING_PRIVATE_KEY (and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD) secrets are set, the build also produces
# signed updater artifacts and a latest.json that installed apps check.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf rpm

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Prepare release notes and updater config
        id: prep
        shell: bash
        run: |
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          {
            echo "notes<<RELEASE_NOTES_EOF"
            scripts/release-notes.sh "$version"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "updater=--config src-tauri/tauri.release.conf.json" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; building without in-app update artifacts."
            echo "updater=" >> "$GITHUB_OUTPUT"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Todos v__VERSION__"
          releaseBody: ${{ steps.prep.outputs.notes }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }} ${{ steps.prep.outputs.updater }}

      - name: Upload portable Linux tarball
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          tarball="$(packaging/linux/make-tarball.sh dist-linux)"
          gh release upload "v${version}" "${tarball}" "${tarball}.sha256" --clobber

  # Re-apply the notes once every job has finished, so they're correct even if
  # the release already existed (tauri-action doesn't update an existing body).
  notes:
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/release-notes.yml
